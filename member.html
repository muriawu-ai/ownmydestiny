<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>會員中心 ✦ ownmydestiny</title>
  <link rel="icon" href="images/star.svg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"><div class="wrap">
    <a class="brand" href="index.html"><img src="images/star.svg" alt="">ownmydestiny</a>
    <nav class="nav"><a class="roll" id="adminLink" href="admin.html" style="display:none"><span>後台</span><span>後台</span></a><a class="roll" href="index.html"><span>回首頁</span><span>回首頁</span></a><button class="btn" id="logoutBtn" style="display:none">登出</button></nav>
  </div></header>

  <main>
    <section class="section" style="padding-top:64px">
      <div class="wrap">
        <div class="sec-head">
          <span class="label">( Member )</span>
          <h2>Hello Flow-er!</h2>
          <span class="zh" id="who">會員中心</span>
          <div class="rule" style="transform:none"></div>
        </div>

        <p id="gate" class="empty-note">載入中…</p>

        <div id="panel" style="display:none">
          <div class="grid3" style="margin-bottom:18px">
            <div class="ws"><span class="date">等級</span><h3 id="tier">—</h3><span class="meta">完成解盤後自動升級</span></div>
            <div class="ws"><span class="date">點數</span><h3 id="points">0</h3><span class="meta">抽牌、消費與回饋都會累積</span></div>
            <div class="ws"><span class="date">今日抽牌</span><h3 id="used">—</h3><span class="meta"><a href="index.html#draw" style="color:var(--accent)">前往抽牌 →</a></span></div>
          </div>

          <div class="mcard" id="bookings"><h3>我的預約</h3><div id="bkList"></div><a class="btn" href="booking.html" style="margin-top:12px">預約新的諮詢</a></div>

          <div class="mcard" id="notices">
            <h3>站內通知 <small id="unreadTag"></small></h3>
            <div id="noteList"></div>
            <button class="btn" id="readAll" style="margin-top:12px">全部標示為已讀</button>
          </div>

          <div class="mcard">
            <h3>個人資料</h3>
            <label class="lbl">暱稱</label><input class="field" id="fName" maxlength="40">
            <label class="lbl">Instagram 帳號（選填，例如 ownmydestiny）</label><input class="field" id="fIg" maxlength="40" placeholder="不需要 @">
            <label class="lbl">地區</label>
            <select class="field" id="fRegion"><option value="">請選擇</option><option value="TW">台灣</option><option value="HK">香港</option></select>
            <label class="chk"><input type="checkbox" id="fMarketing"> 我願意收到 Email 行銷訊息（取消勾選後仍會收到站內通知）</label>
            <button class="btn primary" id="saveBtn">儲存</button>
            <p class="msg" id="saveMsg" aria-live="polite"></p>
          </div>

          <div class="mcard">
            <h3>登入密碼</h3>
            <input class="field" id="newPw" type="password" placeholder="新密碼（至少 8 個字）" autocomplete="new-password" minlength="8">
            <button class="btn" id="pwSave">設定／更改密碼</button>
            <p class="msg" id="pwMsg" aria-live="polite"></p>
          </div>

          <div class="grid3">
            <div class="mcard"><h3>點數紀錄</h3><div id="ledger"></div></div>
            <div class="mcard"><h3>抽牌紀錄</h3><div id="history"></div></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/member.js"></script>
  <script src="js/bg.js"></script>
</body>
</html>
